name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install HAProxy (used by the tests for haproxy -c and a live instance)
        run: sudo apt-get update && sudo apt-get install -y haproxy
      - name: Build UI
        working-directory: web
        run: npm ci && npm run build
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        haproxy: ["2.8", "2.9", "3.0", "3.2"]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          img=ghcr.io/${{ github.repository_owner }}/sluiceops
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v=${GITHUB_REF#refs/tags/v}
            tags="$img:haproxy${{ matrix.haproxy }},$img:$v-haproxy${{ matrix.haproxy }}"
            if [[ "${{ matrix.haproxy }}" == "3.2" ]]; then tags="$tags,$img:latest,$img:$v"; fi
          else
            v=main-${GITHUB_SHA::7}
            tags="$img:edge-haproxy${{ matrix.haproxy }}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            HAPROXY_VERSION=${{ matrix.haproxy }}
            VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=haproxy${{ matrix.haproxy }}
          cache-to: type=gha,mode=max,scope=haproxy${{ matrix.haproxy }}
