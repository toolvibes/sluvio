###############################################################################
# HAProxy 2.9 — distributed cluster (anonymisiertes Praxisbeispiel)
#
# SSL wird vom vorgelagerten Reverse Proxy terminiert.
# HAProxy empfängt nur plain HTTP und leitet intern weiter.
#
# Backend pools:
#   backend-api             -> node-1:3000, node-2:3000  (API, leastconn)
#   backend-frontend        -> node-1:80,  node-2:80     (SPA via nginx)
#   backend-landing         -> node-1:8081, node-2:8081  (Landing Page / Docs)
#   backend-signal          -> stream-1:7880             (Signaling-WS)
#
# ⚠️ NUR HTTP/WS läuft über HAProxy. Medien (UDP) gehen NICHT hier durch.
###############################################################################

global
    log stdout format raw local0 info
    maxconn 50000

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    timeout connect  5s
    timeout client   60s
    timeout server   60s
    timeout tunnel   3600s    # WebSocket / long-poll connections

#------------------------------------------------------------------------------
# Stats page — restricted to internal LAN
#------------------------------------------------------------------------------

frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    acl internal src 10.10.0.0/24
    http-request deny unless internal

#------------------------------------------------------------------------------
# HTTP — SSL bereits durch vorgelagerten Proxy terminiert
#------------------------------------------------------------------------------

frontend http
    bind *:80

    # X-Forwarded-Proto durchreichen (oder explizit setzen)
    http-request set-header X-Forwarded-Proto https if { req.hdr(X-Forwarded-Proto) -m found }
    http-request set-header X-Forwarded-Proto http  if !{ req.hdr(X-Forwarded-Proto) -m found }
    http-request set-header X-Real-IP %[src]

    # --- Live-Streaming (host-basiert) ---
    # Signaling ist WebSocket -> `timeout tunnel 3600s` (defaults) trägt das.
    acl is_signal_host   hdr(host) -i stream.example.net
    acl is_liveapp_host  hdr(host) -i live.example.net

    # --- Billing (host-basiert, Stack liegt auf node-1) ---
    # Muss vor den Pfad-ACLs greifen: /api/ gehört sonst dem Haupt-Backend.
    acl is_bill_app_host      hdr(host) -i app.billing.example.de
    acl is_bill_landing_host  hdr(host) -i billing.example.de
    acl is_bill_landing_host  hdr(host) -i www.billing.example.de

    # --- Recipes (host-basiert, geclusterter Stack rc-1/rc-2/…) ---
    # Vorerst deaktiviert – zum Aktivieren ACLs, use_backend und Backends unten einkommentieren.
    # acl is_rc_api_host   hdr(host) -i api.recipes.example.net
    # acl is_rc_web_host   hdr(host) -i recipes.example.net
    # acl is_rc_web_host   hdr(host) -i www.recipes.example.net

    # --- PriceTracker (host-basiert, Stack auf node-1) ---
    acl is_pt_api_host   hdr(host) -i price.example.io

    # --- Calendar (host-basiert, Stack auf node-1/node-2) ---
    # Vorerst deaktiviert – zum Aktivieren ACLs, use_backend und Backends unten einkommentieren.
    # acl is_cal_api_host    hdr(host) -i calendar.example.io
    # acl is_cal_admin_host  hdr(host) -i calendar-admin.example.io

    acl is_api      path_beg /api/
    acl is_webhook  path_beg /webhook
    acl is_ws       path_beg /socket.io/

    # Inject WebSocket upgrade headers before routing
    http-request set-header Upgrade    websocket  if is_ws
    http-request set-header Connection "Upgrade"  if is_ws

    # Host-Routing zuerst (erste passende use_backend gewinnt)
    use_backend backend-signal          if is_signal_host
    use_backend backend-livestream-app  if is_liveapp_host
    use_backend backend-bill-web        if is_bill_app_host
    use_backend backend-bill-landing    if is_bill_landing_host

    # use_backend backend-recipes-api  if is_rc_api_host
    # use_backend backend-recipes-web  if is_rc_web_host

    use_backend backend-pricetracker-api  if is_pt_api_host

    # use_backend backend-calendar-api    if is_cal_api_host
    # use_backend backend-calendar-admin  if is_cal_admin_host

    use_backend backend-api  if is_api
    use_backend backend-api  if is_webhook
    use_backend backend-api  if is_ws
    default_backend backend-frontend

#------------------------------------------------------------------------------
# Backend: API instances (port 3000)
#
# node-1 has SCHEDULER_ENABLED=true — runs cron/timer nodes.
# node-2 is a pure worker — both handle REST + WebSocket equally.
#------------------------------------------------------------------------------

backend backend-api
    balance leastconn
    option  httpchk GET /api/health
    http-check expect status 200
    timeout tunnel 3600s

    server api-1 10.10.0.184:3000 check inter 5s fall 3 rise 2
    server api-2 10.10.0.185:3000 check inter 5s fall 3 rise 2

#------------------------------------------------------------------------------
# Backend: SPA via nginx (port 80)
#------------------------------------------------------------------------------

backend backend-frontend
    balance roundrobin
    option  httpchk GET /healthz
    http-check expect status 200

    server api-1-fe 10.10.0.184:80 check inter 10s fall 3 rise 2
    server api-2-fe 10.10.0.185:80 check inter 10s fall 3 rise 2

#------------------------------------------------------------------------------
# Frontend: Landing Page (port 8081)
#------------------------------------------------------------------------------

frontend landing
    bind *:8081

    http-request set-header X-Forwarded-Proto https if { req.hdr(X-Forwarded-Proto) -m found }
    http-request set-header X-Forwarded-Proto http  if !{ req.hdr(X-Forwarded-Proto) -m found }
    http-request set-header X-Real-IP %[src]

    default_backend backend-landing

#------------------------------------------------------------------------------
# Backend: Landing Page instances (port 8081 on each node)
#------------------------------------------------------------------------------

backend backend-landing
    balance roundrobin
    option  httpchk GET /
    http-check expect status 200

    server landing-1 10.10.0.184:8081 check inter 15s fall 3 rise 2
    server landing-2 10.10.0.185:8081 check inter 15s fall 3 rise 2

#------------------------------------------------------------------------------
# Backend: Signaling-WS (stream-1:7880)
#------------------------------------------------------------------------------

backend backend-signal
    balance leastconn
    option  httpchk GET /
    http-check expect status 200
    timeout tunnel 3600s

    server stream-1 10.10.0.186:7880 check inter 10s fall 3 rise 2

#------------------------------------------------------------------------------
# Backend: Livestream App/UI (stream-1:3080)
#
# UI-Schutz: primär über vorgelagerten Proxy (Basic Auth).
# Alternativ hier per HAProxy — Beispiel (auskommentiert):
#   userlist livestream-users
#     user chef password $6$<sha512-hash>
#   http-request auth realm livestream if !{ http_auth(livestream-users) }
#------------------------------------------------------------------------------

backend backend-livestream-app
    balance roundrobin
    option  httpchk GET /config
    http-check expect status 200

    server stream-1-app 10.10.0.186:3080 check inter 10s fall 3 rise 2

#------------------------------------------------------------------------------
# Backend: Billing Web/SPA (node-1:8090)
#------------------------------------------------------------------------------

backend backend-bill-web
    balance roundrobin
    option  httpchk GET /healthz
    http-check expect status 200

    server node-1-bill-web 10.10.0.184:8090 check inter 10s fall 3 rise 2

#------------------------------------------------------------------------------
# Backend: Billing Landingpage (node-1:8082)
#------------------------------------------------------------------------------

backend backend-bill-landing
    balance roundrobin
    option  httpchk GET /healthz
    http-check expect status 200

    server node-1-bill-landing 10.10.0.184:8082 check inter 10s fall 3 rise 2

#------------------------------------------------------------------------------
# Backend: Recipes API (port 3000) — geclustert
#
# Genau EIN Host führt die Cron-Jobs aus; alle bedienen REST gleichwertig.
# >>> IPs unten auf die echten Hosts setzen. Weitere Hosts = weitere Zeilen.
#------------------------------------------------------------------------------

# backend backend-recipes-api
    # balance leastconn
    # option  httpchk GET /healthz
    # http-check expect status 200
    # timeout tunnel 3600s

    # server rc-1 10.10.0.201:3000 check inter 5s fall 3 rise 2
    # server rc-2 10.10.0.202:3000 check inter 5s fall 3 rise 2

#------------------------------------------------------------------------------
# Backend: Recipes Web (SSR, Node, port 4000) — geclustert
#------------------------------------------------------------------------------

# backend backend-recipes-web
    # balance roundrobin
    # option  httpchk GET /
    # http-check expect status 200

    # server rc-1-web 10.10.0.201:4000 check inter 10s fall 3 rise 2
    # server rc-2-web 10.10.0.202:4000 check inter 10s fall 3 rise 2

#------------------------------------------------------------------------------
# Backend: PriceTracker API (Container-Port 3000, Host-Port 3040)
#------------------------------------------------------------------------------

backend backend-pricetracker-api
    balance leastconn
    option  httpchk GET /healthz
    http-check expect status 200

    server pt-1 10.10.0.184:3040 check inter 5s fall 3 rise 2

