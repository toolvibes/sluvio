###############################################################################
# Sluvio demo configuration (fictional shop, all names made up)
#
#   shop.example.test   -> online shop (two servers)
#   /api/               -> order API (two servers)
#   blog.example.test   -> blog
#   news.example.test   -> newsletter, prepared but disabled (commented out)
#
# Try it:  curl -H "Host: shop.example.test" http://127.0.0.1:8080/
###############################################################################

global
    log stdout format raw local0 info
    maxconn 2000

defaults
    log     global
    mode    http
    option  httplog
    timeout connect  5s
    timeout client   30s
    timeout server   30s

# HAProxy's own statistics page
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s

frontend http
    bind *:80

    acl is_shop  hdr(host) -i shop.example.test
    acl is_blog  hdr(host) -i blog.example.test
    acl is_api   path_beg /api/

    # Newsletter goes live soon - uncomment to enable (or flip the switch in Sluvio)
    # acl is_newsletter hdr(host) -i news.example.test
    # use_backend newsletter if is_newsletter

    use_backend api   if is_api
    use_backend blog  if is_blog
    use_backend shop  if is_shop
    default_backend shop

# Online shop: two identical servers
backend shop
    balance roundrobin
    option  httpchk GET /
    http-check expect status 200
    server shop-1 shop-1:80 check inter 5s
    server shop-2 shop-2:80 check inter 5s

# Order API
backend api
    balance leastconn
    option  httpchk GET /
    server api-1 api-1:80 check inter 5s
    server api-2 api-2:80 check inter 5s

backend blog
    server blog-1 blog-1:80 check

# Newsletter (prepared, not live yet)
# backend newsletter
#     server news-1 news-1:80 check
